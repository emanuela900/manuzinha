<hmtl>
  <head>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      a {
        text-decoration: none;
      }

      .box {
        font-size: 20px;
        color: white;
        height: 1900px;
        width: 1624px;
        border-radius: 10px;
        background: #191919;
        flex-direction: column;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .buttons-container {
        display: flex;
        justify-content: space-around;
        height: 50px;
        width: 150px;
      }
      button {
        height: 30px;
        width: 50px;
        background: withe;
        border-radius: 5px;
        color: pink;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>Tive um dejavu e viajei anos luz, quer saber o que eu vi?</p>
      <div class="d-flex justify-center-around">
        <button id="yes" class="btn btn-light">
          <a href="https://youtu.be/yX-lFcWKcP0?si=BOBZw34kMWnyypL5">Sim</a>
        </button>

        <button id="no">Nao</button>
        
        </button>
      </div>
    </div>
  
  <script>
     
        document.querySelector('#no').addEventListener("mouseover", function() {
   

        let height = window.innerHeight - 50;
        let width = window.innerWidth - 50;
        this.style.position = "absolute";
        this.style.top = Math.floor(Math.random() * height) + "px";    
        this.style.left = Math.floor(Math.random() * width) + "px";

    })

  </script>
  </body>
  </html>
